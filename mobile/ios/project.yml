name: DodgeBlitz
options:
  bundleIdPrefix: com.fpsvic
  deploymentTarget:
    iOS: "16.0"
targets:
  DodgeBlitz:
    type: application
    platform: iOS
    sources:
      - DodgeBlitz
    info:
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fpsvic.dodgeblitz
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
